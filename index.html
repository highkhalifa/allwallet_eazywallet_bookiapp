w gets a visible sliver instead of vanishing","Long category names shrink and wrap inside the ring instead of spilling out"]},{v:"0.23.3",items:["Donut fixed properly: the ring and its segments were both animating transform, and in SVG that overrides the shape","Now one fade on a wrapper, nothing animating the geometry"]},{v:"0.23.2",items:["Colour back on the category rows — lighter than before, so they stay roomy"]},{v:"0.23.1",items:["Fixed the donut vanishing — the draw animation was fighting the shape itself","The update prompt no longer offers the version you're already on","Long-pressing a button no longer selects text; amounts stay copyable","The Bank/Card filter looks like a filter, not a second entry-type switch"]},{v:"0.23.0",items:["The dirham symbol replaces “AED” throughout, drawn so it shows on any phone","Unicode adds the character in September 2026; this works until fonts catch up"]},{v:"0.22.0",items:["The donut draws itself when you open Plan — arcs unroll in turn, then the figure and legend arrive","Category rows are white again, with more room to breathe"]},{v:"0.21.0",items:["Fixed drag-and-drop: the card now follows your finger instead of drifting to the corner","The category you're dropping onto lifts and glows; the others dim","All / Bank / Card sit on one line as equal thirds, whatever the numbers"]},{v:"0.20.1",items:["Worth knowing and Spent by category now sit in bordered panels, like the input box"]},{v:"0.20.0",items:["Money in is split: what you planned for, and what merely arrived","A friend repaying a debt no longer counts as salary against your plan","Choose which income source money came from, or “Something else”"]},{v:"0.19.0",items:["The update prompt names the version you're moving to, not just the one you're on","“Salary came in” with no number uses the amount from your plan, and says so","History is divided by month, with each month's total"]},{v:"0.18.0",items:["What you type is no longer lost when you swipe to another tab","A screenshot you've scanned survives a swipe too — the rows wait for you","Entry type and card choice stay put instead of flickering back"]},{v:"0.17.2",items:["Deleting a card no longer leaves it selected in the input — it falls back to another card, or the bank","Card payment switches back to Money out if you delete every card"]},{v:"0.17.1",items:["The input and its options are one block now, with a divider — not three loose rows","Choosing a type no longer shifts the page: the options row keeps its height","Fixed a stray escape code showing as text in the bank tile"]},{v:"0.17.0",items:["Wallet tab reorganised: the number you need is first, notices collapse into one line","In the bank and Owed on cards are compact tiles side by side","Season and income reminders moved inside Worth knowing"]},{v:"0.16.1",items:["Fixed “Working out the advice” hanging forever when AI is off","With no API key it no longer promises advice that isn't coming"]},{v:"0.16.0",items:["Choose the entry type under the input: money out, money in, or card payment","Choose how you paid — cash/bank or which card — instead of it being guessed","Your choice sticks between entries and overrides the parser"]},{v:"0.15.0",items:["After logging, it tells you what the entry became — category, and whether it was bank or card","Fixed: 'paid to cover card' was counted as spending ON the card instead of a repayment","Many more phrasings recognised for card repayments"]},{v:"0.14.4",items:["Income is recognised properly — “nafis 6100” or “rent income” no longer land in Other","Your own income source names count as income words","Fixed a black circle flashing before the app finished loading"]},{v:"0.14.3",items:["Smoother animation: bars and swipes now run on the GPU, so they can use the full 120Hz","Update notes shown before you accept an update, and a full history in Settings"]},{v:"0.14.2",items:["Fixed the breakdown popup showing with no styling","Breakdowns are now a small card instead of a full page","Tapping a transaction to edit it works again"]},{v:"0.14.1",items:["Works when hosted in a folder, so GitHub Pages can serve it","Nothing visible changed — it was needed for the move off Netlify"]},{v:"0.14.0",items:["Seasonal background: a drifting sea in summer, its own mood the rest of the year","Switch it off in Settings → Appearance"]},{v:"0.13.1",items:["Fixed 'Add one by hand' crashing the Wallet tab"]},{v:"0.13.0",items:["Removed the Look tab — two sections now, Money and Settings","Categories get distinct colours even if the data has none","Smoother swiping between tabs"]},{v:"0.12.0",items:["Tap any headline number to see how it was worked out","Version marked as pre-release"]},{v:"0.11.0",items:["Interactive donut for where the plan goes — tap a slice","Cash and card figures reconcile properly"]}],Fm=e=>e>=6&&e<=9?"summer":e>=10&&e<=11?"autumn":e===12||e<=2?"winter":"spring",Fl=[{id:"school",name:"Back to school",month:8,day:25,lead:2,note:"Uniforms, books, transport. Costs land in one go.",hue:"#C9825A",pattern:"grid"},{id:"national",name:"UAE National Day",month:12,day:2,lead:1,note:"Travel, gatherings, gifts over the long weekend.",hue:"#4E8FB0",pattern:"rays"},{id:"newyear",name:"New year",month:1,day:1,lead:1,note:"Renewals and subscriptions tend to bunch here.",hue:"#8478B5",pattern:"dots"},{id:"summer",name:"Summer travel",month:7,day:1,lead:3,note:"Flights get dearer the longer you leave them.",hue:"#5E8C8C",pattern:"waves"},{id:"ramadan",name:"Ramadan",month:2,day:18,lead:2,note:"Groceries, iftar, giving. Dates shift each year — adjust in Plan.",hue:"var(--gold)",pattern:"arch"}];function $l(e,t,n){const[r]=e.split("-").map(Number),a=Date.parse(e+"T00:00:00Z");for(const o of[r,r+1]){const l=Date.UTC(o,t-1,n);if(l>=a)return Math.round((l-a)/864e5)}return 999}const $m={grid:e=>`<defs><pattern id="p" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0v26" fill="none" stroke="${e}" stroke-width="1"/></pattern></defs><rect width="1 /* a long press on a control should act, not select text */
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;}

/* figures read as a ledger column */
.num,.big,.rowNum,input[inputmode="decimal"],input[inputmode="numeric"]{
  font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  letter-spacing:-.01em;}

/* the cycle ring — how far through the pay period you are */
/* segmented control: this is navigation, so it reads as a switch not a filter */
.seg{display:flex;gap:3px;padding:3px;margin:0 0 18px;
  background:var(--card2);border:1px solid var(--line);border-radius:12px;}
.segBtn{flex:1;padding:10px 8px;border:none;border-radius:9px;cursor:pointer;
  background:transparent;color:var(--muted);
  font:inherit;font-size:14px;font-weight:600;letter-spacing:.01em;
  transition:background .16s ease,color .16s ease,box-shadow .16s ease;}
.segBtn.on{background:var(--gold);color:#FFFFFF;
  box-shadow:0 1px 3px rgba(0,0,0,.18);}
.app.light .segBtn.on{color:#FFFFFF;}
.segBtn:active{transform:scale(.985);}

/* night refinements: lift the cards, soften the rules, keep text legible */
.app:not(.light) .hero{background:linear-gradient(180deg,#212627,#191D1E);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset;}
.app:not(.light) .foldCard{background:#191D1E;}
.app:not(.light) .foldHead:active{background:#242A2B;}
.app:not(.light) .seg{background:#191D1E;}
.app:not(.light) .segBtn.on{background:var(--gold);color:#0B0F10;}
.app:not(.light) .themeDial{background:#212627;box-shadow:0 6px 18px rgba(0,0,0,.45);}
.app:not(.light) .foldHead .chev{background:#2A3031;}
.app:not(.light) .nav{background:rgba(16,19,20,.94);border-top:1px solid #2E3436;}
.app:not(.light) .input{background:#212627;border-color:#333A3B;}
.app:not(.light) .btn{background:#212627;border-color:#333A3B;}
.app:not(.light) .btn.gold{color:#0B0F10;}
.app:not(.light) .chip.on{color:#0B0F10;}

/* the swipe track: three panes side by side, only the middle one occupies
   height so a tall History pane can't stretch the others */
.swipeView{overflow:hidden;margin:0 -18px;padding:0 0;touch-action:pan-y;}
.track{display:flex;width:300%;transform:translate3d(-33.3333%,0,0);}
.swipeView.dragging .track{will-change:transform;}
.pane{width:33.3333%;flex:0 0 33.3333%;padding:0 18px;box-sizing:border-box;min-width:0;
  contain:layout paint style;}
.swipeView.dragging .pane:first-child,
.swipeView.dragging .pane:last-child{content-visibility:auto;contain-intrinsic-size:1px 900px;}
/* the side panes take no height until a drag begins, so a long History list
   can't stretch the page while you're sitting on Wallet */
.swipeView:not(.dragging) .pane:first-child,
.swipeView:not(.dragging) .pane:last-child{height:0;overflow:hidden;}
.swipeView.dragging .pane{overflow:hidden;}
@media (prefers-reduced-motion:reduce){.track{transition:none !important;}}

/* a number you can ask about: no button chrome, just a small mark */
.tappableNum{display:inline-flex;align-items:flex-start;gap:6px;
  background:none;border:none;padding:0;margin:0;cursor:pointer;
  color:inherit;font:inherit;text-align:left;}
.tappableNum svg{color:var(--muted);opacity:.55;margin-top:5px;flex:none;}
.tappableNum:active svg{opacity:1;color:var(--gold);}
.tappableNum:active{transform:scale(.99);}

/* ---------- ambient season layer ---------- */
.season{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  contain:strict;transform:translateZ(0);}
.season svg{position:absolute;left:0;width:200%;height:auto;}

/* sea: three bands at different speeds, so it reads as depth not a pattern */
.wave{animation:drift linear infinite;transform-origin:center;
  will-change:transform;backface-visibility:hidden;}
.wave1{bottom:88px;opacity:.30;animation-duration:26s;}
.wave2{bottom:56px;opacity:.22;animation-duration:38s;animation-direction:reverse;}
.wave3{bottom:26px;opacity:.16;animation-duration:52s;}
@keyframes drift{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* sand: a still band the sea sits on */
.sand{position:absolute;left:0;right:0;bottom:0;height:96px;}

/* winter drifts down, spring breathes, autumn tilts */
.fall{animation:fall linear infinite;}
@keyframes fall{from{transform:translateY(-40px);}to{transform:translateY(100vh);}}
.breathe{animation:breathe 14s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.10;}50%{opacity:.22;}}

@media (prefers-reduced-motion:reduce){
  .wave,.fall,.breathe{animation:none;}
}

/* a compact card, sized to its contents, not a full-height sheet */
.mathsCard{width:100%;max-width:330px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;
  padding:16px 16px 15px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--sand);
  max-height:70vh;overflow-y:auto;
  animation:pop .16s ease-out;}
@keyframes pop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.mathsCard{animation:none;}}

/* the small type/source bar under the input */
.entryBar{margin-top:9px;}
.seg.segSm{margin-bottom:0;padding:2px;border-radius:10px;}
.seg.segSm .segBtn{padding:7px 6px;font-size:12.5px;border-radius:8px;}

/* compact stat tile: a number you can ask about */
.statCard{display:flex;flex-direction:column;align-items:flex-start;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 13px 12px;cursor:pointer;color:inherit;font:inherit;min-width:0;
  transition:border-color .15s,transform .1s;}
.statCard:active{transform:scale(.985);border-color:var(--gold);}
.statCard > span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.noticeHead{display:flex;align-items:center;gap:8px;width:100%;
  background:none;border:none;padding:2px 0;cursor:pointer;
  color:inherit;font:inherit;text-align:left;border-radius:8px;}
.noticeCount{font-size:10px;font-weight:700;color:var(--leather);
  background:var(--muted);border-radius:99px;padding:1px 7px;line-height:1.7;}

/* the composer: field and its options as one object */
.composer{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;}
.composer .askRow{background:transparent;border:none;border-radius:0;padding:8px 8px 8px 15px;}
.composerOpts{border-top:1px solid var(--line);padding:11px 11px 12px;background:var(--card2);}
.composerOpts .seg.segSm{background:var(--card);border-color:var(--line);}
/* reserved height stops the layout jumping when the row changes */
.composerRow{min-height:38px;display:flex;align-items:center;margin-top:9px;}
.composerRow .chips{margin:0;}
.composerNote{font-size:12.5px;color:var(--muted);}
.ghostBtn{background:transparent !important;border:1px solid var(--line) !important;cursor:pointer;}

.toastNote{position:fixed;left:0;right:0;bottom:calc(126px + env(safe-area-inset-bottom));
  z-index:38;text-align:center;font-size:12px;color:var(--muted);
  pointer-events:none;padding:0 20px;}

/* month divider in History */
.monthBar{display:flex;align-items:baseline;gap:10px;
  margin:26px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--line);}
.monthBar:first-child{margin-top:8px;}
.monthName{flex:1;font-size:17px;font-weight:600;letter-spacing:-.01em;}
.monthTotal{font-size:13px;color:var(--muted);}

/* a section that reads as one object, like the composer */
.panel{border:1px solid var(--line);border-radius:16px;background:var(--card);
  overflow:hidden;margin-top:16px;}
.panelHead{display:flex;align-items:center;gap:8px;width:100%;
  padding:14px 15px;background:transparent;border:none;
  color:inherit;font:inherit;text-align:left;cursor:pointer;}
.panelHead:active{background:var(--card2);}
.panelBody{padding:13px 15px 15px;border-top:1px solid var(--line);}
/* the notices sit on the tinted half, so they belong to the header above */
.panelBody.tinted{background:var(--card2);}

/* two-line segment: label above, figure below, so long numbers never wrap */
.seg.segStack{margin:0 0 12px;}
.seg.segStack .segBtn{display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:8px 4px;line-height:1.25;}
.segLabel{font-size:12px;font-weight:600;letter-spacing:.02em;}
.segAmt{font-size:13px;font-weight:600;opacity:.85;}

/* the ring draws itself: each arc unrolls from nothing, in order */
/* Lesson learned twice: never animate a property that also defines the shape,
   and never animate transform on both a <g> and its children — in SVG the CSS
   transform replaces the transform attribute and the two fight.
   So: one animation, on a wrapper that owns no geometry, on opacity alone. */
/* The ring assembles itself, one segment at a time.
   Opacity only: transform and stroke-dasharray both define the shape in SVG,
   and animating either is what made the donut vanish twice. */
@keyframes segIn{from{opacity:0;}to{opacity:1;}}
.seg-in{animation:segIn .34s ease-out backwards;}
@keyframes trackIn{from{opacity:0;}to{opacity:1;}}
.ringWrap{animation:trackIn .3s ease-out;}

/* the centre figure settles a moment after the ring closes */
@keyframes riseIn{from{opacity:0;transform:translateY(6px) scale(.96);}to{opacity:1;transform:none;}}
.donutCentre{animation:riseIn .45s ease-out .5s backwards;}

/* legend rows arrive under the ring, one after another */
@keyframes rowIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.legendRow{animation:rowIn .34s ease-out backwards;}

@media (prefers-reduced-motion:reduce){
  .arc,.donutCentre,.dial,.legendRow{animation:none;}
}

/* amounts and notes are worth copying, so keep those selectable */
input,textarea,.num,.txt,.empty{-webkit-user-select:text;user-select:text;}
button,.chip,.segBtn,.tab,.foldHead,.panelHead,.statCard,label{
  -webkit-user-select:none;user-select:none;}

/* The filter is a view switch, not an action: quieter, outlined rather than
   filled, so it doesn't compete with the entry-type control above it. */
.seg.segStack{background:transparent;border:1px dashed var(--line);}
.seg.segStack .segBtn{background:transparent;color:var(--muted);
  border:1px solid transparent;box-shadow:none;}
.seg.segStack .segBtn.on{background:transparent;color:var(--gold);
  border-color:var(--gold);box-shadow:none;}
.seg.segStack .segBtn.on .segAmt{opacity:1;}

/* a long list gets its own scroll, so it can't swallow the page */
.scrollBox{max-height:290px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-right:4px;overscroll-behavior:contain;
  mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent);
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent);}
.scrollBox::-webkit-scrollbar{width:4px;}
.scrollBox::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}

/* the small question mark and the note it reveals */
.tipWrap{display:inline-flex;align-items:flex-start;gap:7px;flex-wrap:wrap;}
.tipBtn{width:17px;height:17px;flex:none;border-radius:99px;
  border:1px solid var(--line);background:var(--card2);color:var(--muted);
  font-size:11px;font-weight:700;line-height:1;cursor:pointer;padding:0;
  display:inline-flex;align-items:center;justify-content:center;}
.tipBtn[aria-expanded="true"]{background:var(--gold);color:var(--leather);border-color:var(--gold);}
.tipText{flex:1;min-width:0;font-size:12.5px;line-height:1.5;color:var(--muted);}

/* the composer's own header, where its help mark belongs */
.composerTop{display:flex;align-items:center;gap:8px;padding:12px 15px 0;}
.composerTop .tipWrap{flex:none;}
.composerTop .tipText{position:absolute;left:15px;right:15px;margin-top:26px;
  background:var(--card2);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;z-index:5;box-shadow:0 8px 22px rgba(0,0,0,.16);}
.composer{position:relative;}

.themeDial{position:fixed;right:16px;z-index:40;
  bottom:calc(78px + env(safe-area-inset-bottom));
  width:44px;height:44px;border-radius:99px;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);color:var(--muted);
  border:1px solid var(--line);cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
  transition:transform .12s ease, color .15s, background .15s;}
.themeDial:active{transform:scale(.92);color:var(--gold);}

.ring{position:absolute;right:14px;top:14px;width:64px;height:64px;transform:rotate(-90deg);}
.ring circle{fill:none;stroke-linecap:round;}
.ringTrack{stroke:var(--line);stroke-width:5;}
.ringFill{stroke:var(--muted);stroke-width:5;transition:stroke-dasharray .6s ease;}
.ringSpend{stroke-width:5;transition:stroke-dasharray .6s ease;}
.ringLabel{position:absolute;right:14px;top:14px;width:64px;height:64px;
  display:flex;align-items:center;justify-content:center;
  font-family:ui-monospace,monospace;font-size:15px;font-weight:600;}
.app *{box-sizing:border-box;}
/* keep content clear of the Dynamic Island, notch and home indicator */
.wrap{max-width:520px;margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 104px calc(18px + env(safe-area-inset-left));}

/* --- tap feedback: you can see exactly what you hit --- */
@media (hover:none){
  .btn:active,.chip:active,.mini:active,.send:active,.tab:active,.row:active,
  button:active,[role="button"]:active{
    transform:scale(.97);
    filter:brightness(1.25);
  }
}
.btn,.chip,.mini,.send,.tab,button{
  transition:transform .09s ease, filter .09s ease, background .15s ease;
  -webkit-tap-highlight-color:transparent;
}
/* a brief ring so an expand/collapse is obvious */
@keyframes tapRing{from{box-shadow:0 0 0 0 rgba(70,192,143,.45);}to{box-shadow:0 0 0 12px rgba(70,192,143,0);}}
.tapped{animation:tapRing .45s ease-out;}
.row:active{background:var(--card2);}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.hero{border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));border-radius:18px;padding:18px 18px 15px;position:relative;overflow:hidden;}

/* --- ambient mood ---
   A quiet wash behind the page that reflects how the cycle is going.
   Deliberately soft: enough to notice, not enough to nag you daily. */
/* one surface: header, hint and contents all belong to the same card */
.foldCard{border:1px solid var(--line);border-radius:14px;background:var(--card);
  margin-bottom:10px;overflow:hidden;transition:border-color .15s;}
.foldCard[data-open="1"]{border-color:var(--gold);}
.foldHint{padding:0 15px 13px;color:var(--muted);font-size:13px;line-height:1.5;}
.foldBody{padding:14px 15px 16px;border-top:1px solid var(--line);}
.foldHead{display:flex;align-items:center;gap:9px;width:100%;
  background:transparent;border:none;
  padding:14px 15px;cursor:pointer;
  color:inherit;font:inherit;text-align:left;}
.foldHead:active{background:var(--card2);}
.foldHead .chev{margin-left:auto;flex:none;display:flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:99px;background:var(--card2);color:var(--muted);}
.foldHead[aria-expanded="true"]{background:var(--card2);}
.foldHead[aria-expanded="true"] .chev{background:#46C08F;color:#08100F;}

.mood{position:fixed;inset:0;pointer-events:none;z-index:-1;
  transition:background 1.2s ease;}
.mood.good{background:radial-gradient(120% 55% at 50% 0%, rgba(70,192,143,.16), transparent 70%);}
.mood.ok  {background:radial-gradient(120% 55% at 50% 0%, rgba(70,192,143,.13), transparent 70%);}
.mood.warn{background:radial-gradient(120% 55% at 50% 0%, rgba(221,160,56,.15), transparent 70%);}
.mood.over{background:radial-gradient(120% 55% at 50% 0%, rgba(224,106,87,.17), transparent 70%);}

/* the hero picks up a matching edge, so the signal reads at a glance */
.hero.good{border-color:rgba(70,192,143,.34);}
.hero.ok  {border-color:rgba(70,192,143,.30);}
.hero.warn{border-color:rgba(221,160,56,.34);}
.hero.over{border-color:rgba(224,106,87,.40);}
.hero::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;opacity:.85;}
.hero.good::after{background:linear-gradient(90deg,transparent,#46C08F,transparent);}
.hero.ok::after{background:linear-gradient(90deg,transparent,#46C08F,transparent);}
.hero.warn::after{background:linear-gradient(90deg,transparent,#DDA038,transparent);}
.hero.over::after{background:linear-gradient(90deg,transparent,#E06A57,transparent);}
.heroTop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.big{font-size:clamp(42px,12.5vw,58px);line-height:1;font-weight:600;margin:13px 0 3px;}
.big .cur{font-size:.4em;color:var(--muted);margin-right:.35em;vertical-align:.3em;}
.sub{font-size:14px;color:var(--muted);line-height:1.45;}
.sub b{color:var(--sand);font-weight:600;}
.spark{display:flex;align-items:flex-end;gap:2px;height:52px;margin-top:16px;position:relative;}
.paceline{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);opacity:.6;}
.tick{flex:1;border-radius:2px 2px 0 0;min-height:2px;}
.sparkFoot{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--muted);}
.flag{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:9px;}
.flag .txt{flex:1;font-size:14px;line-height:1.45;}
.flag .txt b{font-weight:600;}
.mini{background:none;border:1px solid var(--line);color:var(--gold);border-radius:9px;padding:6px 10px;font:600 12px 'Sofia Sans',sans-serif;cursor:pointer;white-space:nowrap;margin-top:8px;}
.askRow{display:flex;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;}
.askRow input{flex:1;background:none;border:none;outline:none;color:var(--sand);font-size:16px;font-family:inherit;padding:9px 0;min-width:0;}
.askRow input::placeholder{color:var(--muted);}
.send{background:var(--gold);color:#08100F;border:none;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none;}
.send:disabled{opacity:.45;cursor:default;}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0 4px;line-height:1.45;}
.msg{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin-top:14px;}
.msgYou{font-size:13px;color:var(--muted);}
.msgMe{font-size:14.5px;line-height:1.5;margin-top:3px;}
.sect{margin-top:24px;}
.sectHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
.dot{width:9px;height:9px;border-radius:3px;flex:none;}
.rowName{flex:1;font-size:15px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rowNum{font-size:13.5px;color:var(--muted);}
.rowNum b{color:var(--sand);font-weight:600;}
.bar{height:4px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:7px;}
.barIn{transform-origin:left center;will-change:transform;}
.barIn{height:100%;border-radius:99px;}
.over{color:var(--flare);}
.txRow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);}
.txNote{flex:1;min-width:0;}
.txNote div:first-child{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.txMeta{font-size:12px;color:var(--muted);margin-top:2px;}
.icon{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;flex:none;}
.icon:hover{color:var(--flare);background:var(--card2);}
.field{display:flex;align-items:center;gap:10px;padding:9px 0;}
.field label{flex:1;font-size:15px;}
.input{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--sand);padding:9px 11px;font-size:15px;font-family:'IBM Plex Mono',monospace;width:110px;text-align:right;outline:none;}
.input.wide{width:100%;text-align:left;font-family:'Sofia Sans',sans-serif;}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--sand);border-radius:11px;padding:10px 14px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;}
.btn.gold{background:var(--gold);color:#08100F;border-color:var(--gold);}
.btn.ghost{border-style:dashed;color:var(--muted);width:100%;}
.btn.danger{color:var(--flare);border-color:#4A2620;}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(25,23,20,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);}
.navIn{max-width:520px;margin:0 auto;display:flex;padding:8px 12px calc(8px + env(safe-area-inset-bottom));}
.navBtn{flex:1;background:none;border:none;color:var(--muted);display:grid;justify-items:center;gap:3px;padding:7px 0;font:600 11px 'Sofia Sans',sans-serif;cursor:pointer;border-radius:10px;}
.navBtn.on{color:var(--gold);}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:12px;font-size:14px;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:20;}
.toast button{background:none;border:none;color:var(--gold);font:600 14px 'Sofia Sans',sans-serif;display:flex;align-items:center;gap:5px;cursor:pointer;flex:none;}
.empty{color:var(--muted);font-size:14px;padding:14px 0;line-height:1.55;}
