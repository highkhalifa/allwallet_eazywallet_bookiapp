e icon presses in","Fixed a nested blur that stopped the bar's glass rendering at all"]},{v:"0.32.0",items:["Card payment mode is now obvious: amber border and a banner saying it reduces what you owe","It asks you to confirm before saving one, with a ‘No, it’s spending’ button","Card payment no longer stays selected afterwards — that's how it caught you out"]},{v:"0.31.0",items:["You can now change what an entry IS when editing it — money out, money in, or card payment","A purchase logged by mistake can be turned into a card repayment, and the card picked"]},{v:"0.30.0",items:["Tabs have a pill that slides to where you tapped, and a bubble spreading from your finger","Fixed: the edit sheet only offered ‘credit card’ — now it names each card, so editing keeps the right one","The confirmation of where an entry went now appears in the input box itself, with Undo beside it"]},{v:"0.29.0",items:["The paragraph under the category filter moved behind a ? next to the total","Tips now open as a dimmed overlay, the same way tapping a figure does","Every tip has a heading so you know what it's explaining"]},{v:"0.28.1",items:["The help mark no longer takes its own line — it sits at the end of a row that was already there","The line under the big number carries one fact instead of three; the rest is behind the (i)"]},{v:"0.28.0",items:["Fixed the real cause of the missing version number: the old service worker was serving its own cached sw.js, so the app kept reading the version it was already on","The arriving build now announces itself instead of being asked — a message that can't be intercepted","The update prompt no longer lists its own release notes as though they were the new ones"]},{v:"0.27.1",items:["Every remaining “AED” replaced with the dirham mark, including advice and tooltips","The lone ? under the input moved into the box's own header, next to a “Log something” label","The hint row under the input disappears when there's nothing to report"]},{v:"0.27.0",items:["It asks what day you're paid instead of assuming the 27th","The income table has visible column headings — Source, Day, Amount","The 'not sure what to put here' helper now sits above Budgets, before the empty boxes","Export a backup waits until you have entries worth protecting"]},{v:"0.26.0",items:["What's new scrolls in place instead of stretching down the page","The update prompt reads the incoming version from the server, so it always shows the number","Clear the notices in Worth knowing — they return if the figures change","Long explanations are behind a small ? mark now, out of the way until you want them"]},{v:"0.25.0",items:["The ring assembles again — segments appear one after another, then the figure and legend","Animation adapts to how many categories you have, so it always finishes in about a second"]},{v:"0.24.0",items:["Donut works at any number of categories — one, nine, or forty","A category too small to draw now gets a visible sliver instead of vanishing","Long category names shrink and wrap inside the ring instead of spilling out"]},{v:"0.23.3",items:["Donut fixed properly: the ring and its segments were both animating transform, and in SVG that overrides the shape","Now one fade on a wrapper, nothing animating the geometry"]},{v:"0.23.2",items:["Colour back on the category rows — lighter than before, so they stay roomy"]},{v:"0.23.1",items:["Fixed the donut vanishing — the draw animation was fighting the shape itself","The update prompt no longer offers the version you're already on","Long-pressing a button no longer selects text; amounts stay copyable","The Bank/Card filter looks like a filter, not a second entry-type switch"]},{v:"0.23.0",items:["The dirham symbol replaces “AED” throughout, drawn so it shows on any phone","Unicode adds the character in September 2026; this works until fonts catch up"]},{v:"0.22.0",items:["The donut draws itself when you open Plan — arcs unroll in turn, then the figure and legend arrive","Category rows are white again, with more room to breathe"]},{v:"0.21.0",items:["Fixed drag-and-drop: the card now follows your finger instead of drifting to the corner","The category you're dropping onto lifts and glows; the others dim","All / Bank / Card sit on one line as equal thirds, whatever the numbers"]},{v:"0.20.1",items:["Worth knowing and Spent by category now sit in bordered panels, like the input box"]},{v:"0.20.0",items:["Money in is split: what you planned for, and what merely arrived","A friend repaying a debt no longer counts as salary against your plan","Choose which income source money came from, or “Something else”"]},{v:"0.19.0",items:["The update prompt names the version you're moving to, not just the one you're on","“Salary came in” with no number uses the amount from your plan, and says so","History is divided by month, with each month's total"]},{v:"0.18.0",items:["What you type is no longer lost when you swipe to another tab","A screenshot you've scanned survives a swipe too — the rows wait for you","Entry type and card choice stay put instead of flickering back"]},{v:"0.17.2",items:["Deleting a card no longer leaves it selected in the input — it falls back to another card, or the bank","Card payment switches back to Money out if you delete every card"]},{v:"0.17.1",items:["The input and its options are one block now, with a divider — not three loose rows","Choosing a type no longer shifts the page: the options row keeps its height","Fixed a stray escape code showing as text in the bank tile"]},{v:"0.17.0",items:["Wallet tab reorganised: the number you need is first, notices collapse into one line","In the bank and Owed on cards are compact tiles side by side","Season and income reminders moved inside Worth knowing"]},{v:"0.16.1",items:["Fixed “Working out the advice” hanging forever when AI is off","With no API key it no longer promises advice that isn't coming"]},{v:"0.16.0",items:["Choose the entry type under the input: money out, money in, or card payment","Choose how you paid — cash/bank or which card — instead of it being guessed","Your choice sticks between entries and overrides the parser"]},{v:"0.15.0",items:["After logging, it tells you what the entry became — category, and whether it was bank or card","Fixed: 'paid to cover card' was counted as spending ON the card instead of a repayment","Many more phrasings recognised for card repayments"]},{v:"0.14.4",items:["Income is recognised properly — “nafis 6100” or “rent income” no longer land in Other","Your own income source names count as income words","Fixed a black circle flashing before the app finished loading"]},{v:"0.14.3",items:["Smoother animation: bars and swipes now run on the GPU, so they can use the full 120Hz","Update notes shown before you accept an update, and a full history in Settings"]},{v:"0.14.2",items:["Fixed the breakdown popup showing with no styling","Breakdowns are now a small card instead of a full page","Tapping a transaction to edit it works again"]},{v:"0.14.1",items:["Works when hosted in a folder, so GitHub Pages can serve it","Nothing visible changed — it was needed for the move off Netlify"]},{v:"0.14.0",items:["Seasonal background: a drifting sea in summer, its own mood the rest of the year","Switch it off in Settings → Appearance"]},{v:"0.13.1",items:["Fixed 'Add one by hand' crashing the Wallet tab"]},{v:"0.13.0",items:["Removed the Look tab — two sections now, Money and Settings","Categories get distinct colours even if the data has none","Smoother swiping between tabs"]},{v:"0.12.0",items:["Tap any headline number to see how it was worked out","Version marked as pre-release"]},{v:"0.11.0",items:["Interactive donut for where the plan goes — tap a slice","Cash and card figures reconcile properly"]}],Um=e=>e>=6&&e<=9?"summer":e>=10&&e<=11?"autumn":e===12||e<=2?"winter":"spring",Wl=[{id:"school",name:"Back to school",month:8,day:25,lead:2,note:"Uniforms, books, transport. Costs land in one go.",hue:"#C9825A",pattern:"grid"},{id:"natio @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sofia+Sans:wght@400;500;600;700&display=swap');
/* --- light theme: the same ledger, printed on paper --- */
:root.light,.app.light{--leather:#F2F0EA;--card:#FFFFFF;--card2:#F7F5EF;--line:#DDD8CC;--sand:#1A2124;--muted:#6B7A7D;
--gold:#1F8F68;--flare:#C4432F;--leaf:#1F8F68;--amber:#B07914;}
:root.light .hero,.app.light .hero{background:linear-gradient(180deg,#FFFFFF,#F7F5EF);}
:root.light .foldHead,.app.light .foldHead{background:#FFFFFF;}
.app.light .foldHead[aria-expanded="true"]{background:#F0EDE4;border-color:#D2CCBE;}
.app.light .foldHead .chev{background:#EAE6DA;}
:root.light .nav,.app.light .nav{background:rgba(242,240,234,.92);border-top:1px solid #DDD8CC;}

/* Ink & Jade — a ledger, not a bank app.
   Cool ink base, bone text, jade for healthy, clay for over.
   Every figure is set in a tabular monospace, the way a printed
   statement aligns its columns. */
/* Night: the same ledger under a lamp. Near-neutral charcoal rather than a
   heavy blue cast, cards lifted a step off the page, and a brighter jade so
   it holds contrast against a dark ground. */
:root,.app{--leather:#101314;--card:#191D1E;--card2:#212627;--line:#2E3436;--sand:#E8E9E7;--muted:#8B9391;
--gold:#4FCB98;--flare:#F0705B;--leaf:#4FCB98;--amber:#E5A93F;
min-height:100vh;background:var(--leather);color:var(--sand);
/* a long press on a control should act, not select text */
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;}

/* figures read as a ledger column */
.num,.big,.rowNum,input[inputmode="decimal"],input[inputmode="numeric"]{
  font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  letter-spacing:-.01em;}

/* the cycle ring — how far through the pay period you are */
/* segmented control: this is navigation, so it reads as a switch not a filter */
.seg{display:flex;gap:3px;padding:3px;margin:0 0 18px;
  background:var(--card2);border:1px solid var(--line);border-radius:12px;}
.segBtn{flex:1;padding:10px 8px;border:none;border-radius:9px;cursor:pointer;
  background:transparent;color:var(--muted);
  font:inherit;font-size:14px;font-weight:600;letter-spacing:.01em;
  transition:background .16s ease,color .16s ease,box-shadow .16s ease;}
.segBtn.on{background:var(--gold);color:#FFFFFF;
  box-shadow:0 1px 3px rgba(0,0,0,.18);}
.app.light .segBtn.on{color:#FFFFFF;}
.segBtn:active{transform:scale(.985);}

/* night refinements: lift the cards, soften the rules, keep text legible */
.app:not(.light) .hero{background:linear-gradient(180deg,#212627,#191D1E);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset;}
.app:not(.light) .foldCard{background:#191D1E;}
.app:not(.light) .foldHead:active{background:#242A2B;}
.app:not(.light) .seg{background:#191D1E;}
.app:not(.light) .segBtn.on{background:var(--gold);color:#0B0F10;}
.app:not(.light) .themeDial{background:#212627;box-shadow:0 6px 18px rgba(0,0,0,.45);}
.app:not(.light) .foldHead .chev{background:#2A3031;}
.app:not(.light) .nav{background:rgba(16,19,20,.94);border-top:1px solid #2E3436;}
.app:not(.light) .input{background:#212627;border-color:#333A3B;}
.app:not(.light) .btn{background:#212627;border-color:#333A3B;}
.app:not(.light) .btn.gold{color:#0B0F10;}
.app:not(.light) .chip.on{color:#0B0F10;}

/* the swipe track: three panes side by side, only the middle one occupies
   height so a tall History pane can't stretch the others */
.swipeView{overflow:hidden;margin:0 -18px;padding:0 0;touch-action:pan-y;}
.track{display:flex;width:300%;transform:translate3d(-33.3333%,0,0);}
.swipeView.dragging .track{will-change:transform;}
.pane{width:33.3333%;flex:0 0 33.3333%;padding:0 18px;box-sizing:border-box;min-width:0;
  contain:layout paint style;}
.swipeView.dragging .pane:first-child,
.swipeView.dragging .pane:last-child{content-visibility:auto;contain-intrinsic-size:1px 900px;}
/* the side panes take no height until a drag begins, so a long History list
   can't stretch the page while you're sitting on Wallet */
.swipeView:not(.dragging) .pane:first-child,
.swipeView:not(.dragging) .pane:last-child{height:0;overflow:hidden;}
.swipeView.dragging .pane{overflow:hidden;}
@media (prefers-reduced-motion:reduce){.track{transition:none !important;}}

/* a number you can ask about: no button chrome, just a small mark */
.tappableNum{display:inline-flex;align-items:flex-start;gap:6px;
  background:none;border:none;padding:0;margin:0;cursor:pointer;
  color:inherit;font:inherit;text-align:left;}
.tappableNum svg{color:var(--muted);opacity:.55;margin-top:5px;flex:none;}
.tappableNum:active svg{opacity:1;color:var(--gold);}
.tappableNum:active{transform:scale(.99);}

/* ---------- ambient season layer ---------- */
.season{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  contain:strict;transform:translateZ(0);}
.season svg{position:absolute;left:0;width:200%;height:auto;}

/* sea: three bands at different speeds, so it reads as depth not a pattern */
.wave{animation:drift linear infinite;transform-origin:center;
  will-change:transform;backface-visibility:hidden;}
.wave1{bottom:88px;opacity:.30;animation-duration:26s;}
.wave2{bottom:56px;opacity:.22;animation-duration:38s;animation-direction:reverse;}
.wave3{bottom:26px;opacity:.16;animation-duration:52s;}
@keyframes drift{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* sand: a still band the sea sits on */
.sand{position:absolute;left:0;right:0;bottom:0;height:96px;}

/* winter drifts down, spring breathes, autumn tilts */
.fall{animation:fall linear infinite;}
@keyframes fall{from{transform:translateY(-40px);}to{transform:translateY(100vh);}}
.breathe{animation:breathe 14s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:.10;}50%{opacity:.22;}}

@media (prefers-reduced-motion:reduce){
  .wave,.fall,.breathe{animation:none;}
}

/* a compact card, sized to its contents, not a full-height sheet */
.mathsCard{width:100%;max-width:330px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;
  padding:16px 16px 15px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--sand);
  max-height:70vh;overflow-y:auto;
  animation:pop .16s ease-out;}
@keyframes pop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.mathsCard{animation:none;}}

/* the small type/source bar under the input */
.entryBar{margin-top:9px;}
.seg.segSm{margin-bottom:0;padding:2px;border-radius:10px;}
.seg.segSm .segBtn{padding:7px 6px;font-size:12.5px;border-radius:8px;}

/* compact stat tile: a number you can ask about */
.statCard{display:flex;flex-direction:column;align-items:flex-start;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 13px 12px;cursor:pointer;color:inherit;font:inherit;min-width:0;
  transition:border-color .15s,transform .1s;}
.statCard:active{transform:scale(.985);border-color:var(--gold);}
.statCard > span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.noticeHead{display:flex;align-items:center;gap:8px;width:100%;
  background:none;border:none;padding:2px 0;cursor:pointer;
  color:inherit;font:inherit;text-align:left;border-radius:8px;}
.noticeCount{font-size:10px;font-weight:700;color:var(--leather);
  background:var(--muted);border-radius:99px;padding:1px 7px;line-height:1.7;}

/* the composer: field and its options as one object */
.composer{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;}
.composer .askRow{background:transparent;border:none;border-radius:0;padding:8px 8px 8px 15px;}
.composerOpts{border-top:1px solid var(--line);padding:11px 11px 12px;background:var(--card2);}
.composerOpts .seg.segSm{background:var(--card);border-color:var(--line);}
/* reserved height stops the layout jumping when the row changes */
.composerRow{min-height:38px;display:flex;align-items:center;margin-top:9px;}
.composerRow .chips{margin:0;}
.composerNote{font-size:12.5px;color:var(--muted);}
.ghostBtn{background:transparent !important;border:1px solid var(--line) !important;cursor:pointer;}

.toastNote{position:fixed;left:0;right:0;bottom:calc(126px + env(safe-area-inset-bottom));
  z-index:38;text-align:center;font-size:12px;color:var(--muted);
  pointer-events:none;padding:0 20px;}

/* month divider in History */
.monthBar{display:flex;align-items:baseline;gap:10px;
  margin:26px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--line);}
.monthBar:first-child{margin-top:8px;}
.monthName{flex:1;font-size:17px;font-weight:600;letter-spacing:-.01em;}
.monthTotal{font-size:13px;color:var(--muted);}

/* a section that reads as one object, like the composer */
.panel{border:1px solid var(--line);border-radius:16px;background:var(--card);
  overflow:hidden;margin-top:16px;}
.panelHead{display:flex;align-items:center;gap:8px;width:100%;
  padding:14px 15px;background:transparent;border:none;
  color:inherit;font:inherit;text-align:left;cursor:pointer;}
.panelHead:active{background:var(--card2);}
.panelBody{padding:13px 15px 15px;border-top:1px solid var(--line);}
/* the notices sit on the tinted half, so they belong to the header above */
.panelBody.tinted{background:var(--card2);}

/* two-line segment: label above, figure below, so long numbers never wrap */
.seg.segStack{margin:0 0 12px;}
.seg.segStack .segBtn{display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:8px 4px;line-height:1.25;}
.segLabel{font-size:12px;font-weight:600;letter-spacing:.02em;}
.segAmt{font-size:13px;font-weight:600;opacity:.85;}

/* the ring draws itself: each arc unrolls from nothing, in order */
/* Lesson learned twice: never animate a property that also defines the shape,
   and never animate transform on both a <g> and its children — in SVG the CSS
   transform replaces the transform attribute and the two fight.
   So: one animation, on a wrapper that owns no geometry, on opacity alone. */
/* The ring assembles itself, one segment at a time.
   Opacity only: transform and stroke-dasharray both define the shape in SVG,
   and animating either is what made the donut vanish twice. */
@keyframes segIn{from{opacity:0;}to{opacity:1;}}
.seg-in{animation:segIn .34s ease-out backwards;}
@keyframes trackIn{from{opacity:0;}to{opacity:1;}}
.ringWrap{animation:trackIn .3s ease-out;}

/* the centre figure settles a moment after the ring closes */
@keyframes riseIn{from{opacity:0;transform:translateY(6px) scale(.96);}to{opacity:1;transform:none;}}
.donutCentre{animation:riseIn .45s ease-out .5s backwards;}

/* legend rows arrive under the ring, one after another */
@keyframes rowIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.legendRow{animation:rowIn .34s ease-out backwards;}

@media (prefers-reduced-motion:reduce){
  .arc,.donutCentre,.dial,.legendRow{animation:none;}
}

/* amounts and notes are worth copying, so keep those selectable */
input,textarea,.num,.txt,.empty{-webkit-user-select:text;user-select:text;}
button,.chip,.segBtn,.tab,.foldHead,.panelHead,.statCard,label{
  -webkit-user-select:none;user-select:none;}

/* The filter is a view switch, not an action: quieter, outlined rather than
   filled, so it doesn't compete with the entry-type control above it. */
.seg.segStack{background:transparent;border:1px dashed var(--line);}
.seg.segStack .segBtn{background:transparent;color:var(--muted);
  border:1px solid transparent;box-shadow:none;}
.seg.segStack .segBtn.on{background:transparent;color:var(--gold);
  border-color:var(--gold);box-shadow:none;}
.seg.segStack .segBtn.on .segAmt{opacity:1;}

/* a long list gets its own scroll, so it can't swallow the page */
.scrollBox{max-height:290px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-right:4px;overscroll-behavior:contain;
  mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent);
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 18px),transparent);}
.scrollBox::-webkit-scrollbar{width:4px;}
.scrollBox::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}

/* the small question mark */
.tipBtn{width:17px;height:17px;flex:none;border-radius:99px;
  border:1px solid var(--line);background:var(--card2);color:var(--muted);
  font-size:11px;font-weight:700;line-height:1;cursor:pointer;padding:0;
  display:inline-flex;align-items:center;justify-content:center;}
.tipBtn[aria-expanded="true"]{background:var(--gold);color:var(--leather);border-color:var(--gold);}

/* the composer's own header, where its help mark belongs */
/* the mark sits at the end of a row that already exists, so it costs no height */
.composerRow{justify-content:space-between;}
.composerRow .tipWrap{flex:none;margin-left:8px;}
.composer{position:relative;}

/* the confirmation takes the input's place for a moment */
.filedRow{display:flex;align-items:center;gap:10px;padding:14px 12px 14px 15px;
  min-height:58px;animation:filedIn .22s ease-out;}
@keyframes filedIn{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:none;}}
.filedDot{width:9px;height:9px;border-radius:99px;flex:none;}
.filedText{flex:1;min-width:0;font-size:13.5px;line-height:1.35;
  display:flex;flex-direction:column;gap:2px;}
.filedNote{font-size:11.5px;color:var(--muted);}
.filedUndo{flex:none;background:none;border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;color:var(--gold);font:inherit;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:5px;cursor:pointer;}
.filedUndo:active{background:var(--card2);}
@media (prefers-reduced-motion:reduce){.filedRow{animation:none;}}

/* Liquid glass: the pill is a lens, not a coloured rectangle.
   It blurs and lifts what's behind it, carries a bright top edge and a soft
   bottom shadow so light appears to pass through, and stretches along its
   direction of travel before settling — the way a drop of liquid moves. */
.navIn{position:relative;}

.navPill{position:absolute;top:3px;bottom:3px;width:calc(25% - 8px);
  border-radius:15px;pointer-events:none;z-index:0;
  background:linear-gradient(160deg,
    rgba(255,255,255,.85) 0%,
    rgba(255,255,255,.45) 42%,
    rgba(255,255,255,.22) 100%);
  /* no blur here: the bar above already blurs, and a nested backdrop filter
     samples a flattened layer and renders nothing */
  border:1px solid rgba(255,255,255,.7);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.95),
    inset 0 -1px 2px rgba(0,0,0,.05),
    0 4px 12px rgba(0,0,0,.10),
    0 1px 2px rgba(0,0,0,.06);
  transition:left .42s cubic-bezier(.34,1.28,.44,1),

  will-change:left, transform;}

/* mid-flight it stretches, then relaxes */
.navPill.moving{transform:scaleX(1.14) scaleY(.94);}

.app:not(.light) .navPill{
  background:linear-gradient(160deg,
    rgba(255,255,255,.16) 0%,
    rgba(255,255,255,.07) 45%,
    rgba(255,255,255,.03) 100%);
  border-color:rgba(255,255,255,.14);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.20),
    inset 0 -1px 2px rgba(0,0,0,.35),
    0 4px 14px rgba(0,0,0,.45);}

.navBtn{position:relative;z-index:1;overflow:hidden;
  transition:transform .18s cubic-bezier(.34,1.4,.5,1);}
.navBtn:active{transform:scale(.9);}
.navBtn.on svg{transform:scale(1.06);transition:transform .3s cubic-bezier(.34,1.4,.5,1);}

/* the touch spreads as a bubble of light, not a flat disc */
.ripple{position:absolute;width:10px;height:10px;border-radius:99px;
  pointer-events:none;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 34% 30%,
    rgba(255,255,255,.95) 0%,
    rgba(255,255,255,.45) 38%,
    rgba(255,255,255,.10) 62%,
    transparent 72%);
  box-shadow:inset 0 0 6px rgba(255,255,255,.7);
  animation:bubbleOut .58s cubic-bezier(.18,.72,.3,1) forwards;}
@keyframes bubbleOut{
  0%{transform:translate(-50%,-50%) scale(.6);opacity:0;}
  22%{opacity:.85;}
  100%{transform:translate(-50%,-50%) scale(14);opacity:0;}

.app:not(.light) .ripple{

/* repayment mode announces itself: a rare action that moves a balance
   shouldn't look identical to logging a coffee */
.composer.repay{border-color:var(--amber);}
.repayBar{display:flex;align-items:flex-start;gap:8px;
  padding:10px 14px;background:color-mix(in srgb, var(--amber) 16%, var(--card));
  border-bottom:1px solid var(--line);
  font-size:12.5px;line-height:1.45;color:var(--sand);}
.repayBar svg{flex:none;margin-top:2px;color:var(--amber);}
.composer.repay .send{background:var(--amber);color:var(--leather);}

/* the bar under your finger stands out; the rest step back */
.tick{transition:opacity .12s, transform .12s;}
.tick.picked{transform:scaleY(1.06);filter:brightness(1.15);}
.spark{touch-action:pan-y;}

/* the ring is tappable, but must not look like a button */
.ringBtn{position:absolute;top:16px;right:16px;width:64px;height:64px;
  background:none;border:none;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .14s;}
.ringBtn:active{transform:scale(.94);}


/* where your finger is, and what it's on */
.spark{position:relative;}
.scrubLine{position:absolute;top:-4px;bottom:-2px;width:2px;
  transform:translateX(-50%);background:var(--sand);opacity:.35;
  border-radius:2px;pointer-events:none;z-index:2;}
.scrubBubble{position:absolute;bottom:calc(100% + 8px);transform:translateX(-50%);
  background:var(--card);border:1px solid var(--gold);border-radius:10px;
  padding:5px 9px;display:flex;flex-direction:column;align-items:center;gap:0;
  white-space:nowrap;pointer-events:none;z-index:3;
  box-shadow:0 6px 16px rgba(0,0,0,.18);}
.scrubBubble b{font-size:13px;line-height:1.15;color:var(--sand);}
.scrubBubble span{font-size:10px;color:var(--muted);letter-spacing:.02em;}

/* the bars are thin, so the finger gets a taller target than they occupy.
   z-index 0 keeps it beneath the marker and the bars themselves. */
.spark::after{content:"";position:absolute;left:0;right:0;top:-16px;bottom:-16px;
  z-index:0;}
.spark > .tick{position:relative;z-index:1;}

.mini.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);}
.mini.ghost:active{background:var(--card2);}

.themeDial{position:fixed;right:16px;z-index:40;

  display:flex;align-items:center;justify-content:center;
  background:var(--card);color:var(--muted);
  border:1px solid var(--line);cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
  transition:transform .12s ease, color .15s, background .15s;}
.themeDial:active{transform:scale(.92);color:var(--gold);}

.ring{width:64px;height:64px;transform:rotate(-90deg);display:block;}
.ring circle{fill:none;stroke-linecap:round;}
.ringTrack{stroke:var(--line);stroke-width:5;}
.ringFill{stroke:var(--muted);stroke-width:5;transition:stroke-dasharray .6s ease;}
.ringSpend{stroke-width:5;transition:stroke-dasharray .6s ease;}
/* dead centre of the ring: fills the button, so nothing offsets it twice */
.ringLabel{position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:ui-monospace,monospace;font-size:15px;font-weight:600;
  line-height:1;pointer-events:none;}
.app *{box-sizing:border-box;}

/* --- tap feedback: you can see exactly what you hit --- */
@media (hover:none){
  .btn:active,.chip:active,.mini:active,.send:active,.tab:active,.row:active,
  button:active,[role="button"]:active{
    transform:scale(.97);
    filter:brightness(1.25);
  }
}
.btn,.chip,.mini,.send,.tab,button{
  transition:transform .09s ease, filter .09s ease, background .15s ease;
  -webkit-tap-highlight-color:transparent;
}
/* a brief ring so an expand/collapse is obvious */
@keyframes tapRing{from{box-shadow:0 0 0 0 rgba(70,192,143,.45);}to{box-shadow:0 0 0 12px rgba(70,192,143,0);}}

.row:active{background:var(--card2);}

.foldCard[data-open="1"]{border-color:var(--gold);}
